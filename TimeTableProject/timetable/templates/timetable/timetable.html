
<!DOCTYPE html>
<html>
<head>
    <title>My Class Timetable</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #243b64;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            text-align: center;
        }

        th, td {
            border: 2px solid #cccccc;
            padding: 18px;
            font-size: 18px;
        }

        th {
            background-color: #243b64;
            color: white;
        }

        .time {
            background-color: #dce6f1;
            font-weight: bold;
        }

        .python {
            background-color: #b3e5fc;
        }

        .wad {
            background-color: #ffcdd2;
        }

        .digital {
            background-color: #d1c4e9;
        }

        .design {
            background-color: #ffe0b2;
        }

        .calculus {
            background-color: #c8e6c9;
        }

        .career {
            background-color: #fff9c4;
        }

        .empty {
            background-color: #fafafa;
        }

        tr:hover td {
            filter: brightness(0.95);
        }

        @media (max-width: 700px) {
            table {
                min-width: 650px;
            }

            body {
                overflow-x: auto;
            }
        }

    </style>
</head>

<body>

    <h1>MY CLASS TIMETABLE</h1>

    <table>

        <tr>
            <th>Day / Time</th>
            <th>Monday</th>
            <th>Tuesday</th>
            <th>Wednesday</th>
            <th>Thursday</th>
            <th>Friday</th>
            <th>Saturday</th>
        </tr>

        <!-- 8 AM - 10 AM -->
        <tr>
            <td class="time">8 - 10</td>
            <td class="python">Python</td>
            <td class="python">Python</td>
            <td class="python">Python</td>
            <td class="empty"></td>
            <td class="digital">Digital</td>
            <td class="calculus">Calculus</td>
        </tr>

        <!-- 10 AM - 12 PM -->
        <tr>
            <td class="time">10 - 12</td>
            <td class="wad">WAD</td>
            <td class="wad">WAD</td>
            <td class="empty"></td>
            <td class="empty"></td>
            <td class="wad">WAD</td>
            <td class="design">Design</td>
        </tr>

        <!-- 1 PM - 3 PM -->
        <tr>
            <td class="time">1 - 3</td>
            <td class="empty"></td>
            <td class="digital">Digital</td>
            <td class="empty"></td>
            <td class="calculus">Calculus</td>
            <td class="empty"></td>
            <td class="career">Career</td>
        </tr>

        <!-- 3 PM - 5 PM -->
        <tr>
            <td class="time">3 - 5</td>
            <td class="empty"></td>
            <td class="design">Design</td>
            <td class="empty"></td>
            <td class="empty"></td>
            <td class="empty"></td>
            <td class="empty"></td>
        </tr>

    </table>

</body>
</html>
